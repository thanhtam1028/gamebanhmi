name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Có commit mới trên cùng nhánh thì huỷ lượt test cũ đang chạy
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Test API và D1 (Workers runtime)
        run: npm test

      - name: Test game trên trình duyệt Chrome
        run: npm run test:e2e

      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy lên Cloudflare
    needs: test
    # Chỉ deploy khi code đã vào nhánh main (không deploy từ pull request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Không bao giờ chạy hai lượt deploy cùng lúc, và không huỷ lượt đang deploy dở
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra cấu hình deploy
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN (xem README, mục Deploy)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Thiếu secret CLOUDFLARE_ACCOUNT_ID (xem README, mục Deploy)"; exit 1; }
          if grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.jsonc; then
            echo "::error::wrangler.jsonc chưa có database_id thật. Chạy 'npx wrangler d1 create gamebanhmi-db' rồi điền id vào."
            exit 1
          fi

      # Sao lưu database trước khi đổi cấu trúc bảng. Lần deploy đầu database còn trống nên có thể không xuất được.
      - name: Sao lưu D1
        run: npx wrangler d1 export gamebanhmi-db --remote --output=backup.sql || echo "::warning::Không sao lưu được D1 (bình thường ở lần deploy đầu tiên khi chưa có bảng nào)"

      - name: Lưu bản sao lưu
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup
          path: backup.sql
          if-no-files-found: ignore
          retention-days: 14

      - name: Áp dụng migrations cho D1
        run: npx wrangler d1 migrations apply gamebanhmi-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Kiểm tra sau khi deploy
        run: |
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Không tìm thấy địa chỉ workers.dev trong log deploy"; exit 1; }
          echo "Địa chỉ: $url"
          curl -fsS "$url/api/scores" | grep -q '"scores"'
          curl -fsS "$url/" | grep -q 'Bánh Mì Thần Tốc'
          echo "Deploy OK: $url" >> "$GITHUB_STEP_SUMMARY"
