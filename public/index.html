<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bánh Mì Thần Tốc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%96%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b2f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: min(100vw, calc(100vh * 960 / 520)); height: auto; }

  /* Bảng xếp hạng: chỉ hiện khi kết thúc ván và server trả lời được */
  [hidden] { display: none !important; }
  #lb { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10, 10, 30, 0.8);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  #lb .card { width: min(92vw, 380px); max-height: 92vh; overflow: auto; box-sizing: border-box; padding: 20px;
              background: #25264a; border: 2px solid #ffd740; border-radius: 12px; }
  #lb h2 { margin: 0 0 4px; font-size: 24px; color: #ffd740; text-align: center; }
  #lb .sub { margin: 0 0 12px; text-align: center; color: #cfd2ff; }
  #lb ol { margin: 0 0 14px; padding: 0; list-style: none; counter-reset: rank; }
  #lb li { counter-increment: rank; display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px; }
  #lb li::before { content: counter(rank) "."; width: 24px; color: #9fa3d9; }
  #lb li .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lb li.mine { background: #3b3c70; color: #69f0ae; font-weight: bold; }
  #lb .empty { text-align: center; color: #9fa3d9; margin-bottom: 14px; }
  #lb form { display: flex; gap: 8px; margin-bottom: 8px; }
  #lb input { flex: 1; min-width: 0; padding: 9px 10px; font-size: 16px; border-radius: 6px; border: 1px solid #5a5c9c;
              background: #151631; color: #fff; }
  #lb button { padding: 9px 14px; font-size: 16px; border-radius: 6px; border: 0; cursor: pointer;
               background: #ffd740; color: #1b1b2f; font-weight: bold; }
  #lb button:disabled { opacity: 0.5; cursor: default; }
  #lb button.secondary { background: #3b3c70; color: #fff; }
  #lb .actions { display: flex; gap: 8px; }
  #lb .actions button { flex: 1; }
  #lb #lb-msg { min-height: 1.3em; margin: 0 0 8px; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="lb" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
  <div class="card">
    <h2 id="lb-title">Bảng xếp hạng</h2>
    <p class="sub" id="lb-sub"></p>
    <ol id="lb-list"></ol>
    <p class="empty" id="lb-empty" hidden>Chưa có ai trên bảng. Bạn có thể là người đầu tiên!</p>
    <form id="lb-form" autocomplete="off">
      <input id="lb-name" name="name" maxlength="12" placeholder="Tên của bạn (tối đa 12 ký tự)" aria-label="Tên của bạn" required>
      <button id="lb-send" type="submit">Gửi điểm</button>
    </form>
    <p id="lb-msg" role="status"></p>
    <div class="actions">
      <button id="lb-restart" type="button">Chơi lại</button>
      <button id="lb-close" type="button" class="secondary">Đóng</button>
    </div>
  </div>
</div>
<script>
// =====================================================================
// ===== TỰ SỬA Ở ĐÂY =====
// Đổi chữ trong dấu ngoặc kép, lưu file, rồi tải lại trang (Cmd+R) để thấy thay đổi.
// =====================================================================

// Tên nhân vật, hiện ở màn hình bắt đầu
const TEN_NHAN_VAT = "Bánh Mì Thần Tốc";

// Câu đùa hiện ngẫu nhiên khi nhân vật chết (thêm bao nhiêu câu cũng được)
const CAU_DUA_KHI_CHET = [
  "Bánh mì đã bị nướng quá lửa 🔥",
  "Ối, rơi mất pate rồi!",
  "Chuột cống: 1 — Bánh mì: 0",
  "Bánh mì nguội mất rồi, hâm lại thôi!",
  "Thiếu đồ chua nên yếu quá...",
];

// Câu đùa hiện ngẫu nhiên khi thắng
const CAU_DUA_KHI_THANG = [
  "Giòn rụm! Băng chuột cống khóc thét!",
  "Ăn mừng bằng một quả trứng ốp la!",
  "Chiến thắng thơm phức mùi bơ.",
];

// Chữ bay lên khi đạp trúng chuột
const CAU_KHI_DAP_QUAI = ["ối!", "bẹp!", "á à!", "huhu", "chít chít!"];

const DO_CAO_NHAY = 14;      // Độ cao nhảy: số càng lớn nhảy càng cao (nên để 10 đến 16). Cần từ 14 trở lên để hái hoa trên cao
const TOC_DO_CHAY = 5;       // Tốc độ chạy (nên để 3 đến 8)
const SO_MANG = 3;           // Số mạng lúc đầu
const THOI_GIAN_CA_PHE = 8;  // Số giây chạy nhanh sau khi uống cà phê sữa đá

// Bản vẽ màn chơi. Mỗi ký tự là một ô:
//   #  đất            B  gạch          ?  hộp có xu
//   K  hộp bí mật có cà phê (trông giống hộp ?)
//   o  đồng xu        E  chuột cống    P  chỗ xuất phát
//   f  hoa 🌼 (bị chuột cắn thì nhỏ lại, hái hoa để lớn lên)
//   F  cờ đích        dấu cách là khoảng trống
// Hai hàng dưới cùng là mặt đất; chừa khoảng trống để làm hố.
const MAN_CHOI = [
  "                                                                                                    ",
  "                                                                                                    ",
  "                                                                                                    ",
  "                                                                                                    ",
  "                                             o o o                                                  ",
  "                                            BBBBBBB                                                 ",
  "                                 f                                         f                        ",
  "              ?K?                                           B?B                    o o              ",
  "                                      BBBB                                        BBBBB             ",
  "      o o o                                                       BB                                ",
  "  P                   E           E               E             E BB    E               E       F   ",
  "############################   ########################    ###################   ###################",
  "############################   ########################    ###################   ###################",
];
// ===== HẾT PHẦN TỰ SỬA — phía dưới là code chạy game =====


// ---------- Hằng số ----------
const T = 40;                 // cỡ một ô (px)
const VW = 960, VH = 520;     // kích thước khung hình
const STEP = 1 / 60;          // bước thời gian cố định
const GRAVITY = 2000;
const SOLID = "#B?KU";        // U là hộp đã mở
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const UI_FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = VW * DPR;
cv.height = VH * DPR;

// ---------- Trạng thái ----------
let grid, ROWS, COLS, startPos, flag, player, enemies, items, texts, parts, bumps;
let camX = 0, shake = 0, clock = 0, stateTime = 0;
let state = "start";          // start | play | dying | deadmsg | win
let score = 0, coins = 0, lives = SO_MANG, joke = "";

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)] || "";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Đọc màn chơi ----------
function loadLevel() {
  ROWS = MAN_CHOI.length;
  COLS = Math.max(...MAN_CHOI.map((r) => r.length));
  grid = MAN_CHOI.map((r) => r.padEnd(COLS, " ").split(""));
  enemies = []; items = []; texts = []; parts = []; bumps = {};
  flag = null; startPos = null;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const c = grid[y][x], px = x * T, py = y * T;
      if (c === "P") startPos = { x: px + 5, y: py + T - 36 };
      else if (c === "E") enemies.push({ x: px + 3, y: py + T - 28, w: 34, h: 28, vx: -60, vy: 0, onGround: false, active: false, stomped: false, squash: 0 });
      else if (c === "o") items.push({ type: "coin", x: px + T / 2, y: py + T / 2, r: 12 });
      else if (c === "f") items.push({ type: "flower", x: px + T / 2, y: py + 2, r: 16 });   // lơ lửng cao hơn xu một chút
      else if (c === "F") flag = { x: px + T / 2, y: py + T };
      else continue;
      grid[y][x] = " ";
    }
  }
  if (!startPos) startPos = { x: 2 * T + 5, y: (ROWS - 2) * T - 36 };
  if (!flag) flag = { x: (COLS - 2) * T + T / 2, y: (ROWS - 2) * T };

  player = { x: startPos.x, y: startPos.y, w: 30, h: 36, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, sx: 1, sy: 1, coffee: 0, rot: 0, small: false, inv: 0 };
  camX = 0;
}

function newGame() {
  score = 0; coins = 0; lives = SO_MANG;
  loadLevel();
}

// ---------- Va chạm với ô ----------
function solid(tx, ty) {
  if (tx < 0 || tx >= COLS) return true;   // hai mép màn là tường
  if (ty < 0 || ty >= ROWS) return false;  // dưới đáy là hố
  return SOLID.includes(grid[ty][tx]);
}

function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (solid(tx, ty)) return true;
  return false;
}

// Di chuyển theo X; trả về true nếu đụng tường (đã đẩy ra sát mép ô)
function moveX(e, dx) {
  e.x += dx;
  if (!overlapsSolid(e)) return false;
  if (dx > 0) e.x = Math.floor((e.x + e.w - 0.01) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  return true;
}

// Di chuyển theo Y; trả về true nếu đụng đất hoặc trần
function moveY(e, dy) {
  e.y += dy;
  if (!overlapsSolid(e)) return false;
  if (dy > 0) e.y = Math.floor((e.y + e.h - 0.01) / T) * T - e.h;
  else e.y = (Math.floor(e.y / T) + 1) * T;
  return true;
}

const overlapRect = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ---------- Âm thanh (tự tạo, không cần file) ----------
let actx = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
const SFX = {
  //        kiểu        tần số đầu, cuối, thời lượng, âm lượng
  jump:  ["square",   320, 640,  0.12, 0.06],
  coin:  ["square",   988, 1480, 0.12, 0.05],
  stomp: ["triangle", 600, 70,   0.18, 0.25],
  bonk:  ["triangle", 160, 90,   0.08, 0.15],
  power: ["sawtooth", 260, 1300, 0.45, 0.05],
  land:  ["sine",     140, 60,   0.07, 0.12],
  die:   ["sawtooth", 500, 50,   0.8,  0.07],
  hurt:  ["sawtooth", 700, 120,  0.25, 0.07],
  grow:  ["square",   300, 900,  0.3,  0.05],
  win:   ["square",   520, 1560, 0.6,  0.05],
};
function sfx(name) {
  if (!actx) return;
  const [type, f1, f2, dur, vol] = SFX[name];
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

// ---------- Hiệu ứng ----------
function floatText(text, x, y, color = "#fff", size = 22) {
  texts.push({ text, x, y, color, size, life: 0.9, max: 0.9 });
}
function crumbs(x, y, n = 6, color = "#d9a05b") {
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx: (Math.random() - 0.5) * 240, vy: -Math.random() * 260, life: 0.5, max: 0.5, color, size: 4 });
}
function confetti(x, y) {
  const colors = ["#ff5252", "#ffd740", "#69f0ae", "#40c4ff", "#e040fb"];
  for (let i = 0; i < 70; i++)
    parts.push({ x, y, vx: (Math.random() - 0.5) * 700, vy: -300 - Math.random() * 600, life: 2, max: 2, color: pick(colors), size: 6 });
}

// ---------- Luật chơi ----------
function bump(tx, ty) {
  const c = grid[ty] && grid[ty][tx];
  bumps[tx + "," + ty] = 0.15;
  if (c === "?") {
    grid[ty][tx] = "U";
    coins++; score += 50;
    parts.push({ coin: true, x: tx * T + T / 2, y: ty * T - 6, vx: 0, vy: -480, life: 0.45, max: 0.45 });
    floatText("+1", tx * T + T / 2, ty * T - 20, "#ffd740");
    sfx("coin");
  } else if (c === "K") {
    grid[ty][tx] = "U";
    items.push({ type: "coffee", x: tx * T + T / 2, y: ty * T - T / 2, r: 16 });
    floatText("Ơ, cà phê!", tx * T + T / 2, ty * T - 30, "#ffe0b2");
    sfx("power");
  } else {
    sfx("bonk");
  }
}

function die() {
  if (state !== "play") return;
  state = "dying"; stateTime = 0;
  lives--;
  joke = pick(CAU_DUA_KHI_CHET);
  player.vx = 0; player.vy = -700; player.coffee = 0;
  shake = 12;
  sfx("die");
}

// Đổi cỡ nhân vật (giữ nguyên vị trí chân). Trả về false nếu lớn lên mà bị kẹt trần.
function setSize(small) {
  const p = player;
  const w = small ? 22 : 30, h = small ? 25 : 36;
  const old = { x: p.x, y: p.y, w: p.w, h: p.h };
  p.x += (p.w - w) / 2;
  p.y += p.h - h;
  p.w = w; p.h = h;
  if (!small && overlapsSolid(p)) {
    p.x = old.x; p.y = old.y; p.w = old.w; p.h = old.h;
    return false;
  }
  p.small = small;
  return true;
}

// Bị chuột cắn: đang lớn thì nhỏ lại, đang nhỏ thì mới chết
function hurt() {
  if (state !== "play" || player.inv > 0) return;
  if (player.small) { die(); return; }
  setSize(true);
  player.inv = 1.5;
  player.vy = -420;               // nảy lên một cái, không bị đẩy lùi (tránh rơi xuống hố)
  player.onGround = false;
  floatText("Ái! Nhỏ lại rồi", player.x + player.w / 2, player.y - 10, "#ff8a65", 22);
  shake = 8;
  sfx("hurt");
}

function win() {
  if (state !== "play") return;
  state = "win"; stateTime = 0;
  joke = pick(CAU_DUA_KHI_THANG);
  player.vx = 0;
  confetti(player.x + player.w / 2, player.y);
  sfx("win");
  setTimeout(() => sfx("coin"), 200);
  setTimeout(() => sfx("coin"), 400);
}

function restart() {
  if (state === "deadmsg") {
    if (lives <= 0) newGame(); else loadLevel();
    state = "play";
  } else if (state === "win") {
    newGame();
    state = "play";
  }
}

// ---------- Cập nhật nhân vật ----------
function updatePlayer(dt) {
  const p = player;
  const mul = p.coffee > 0 ? 1.8 : 1;
  const maxV = TOC_DO_CHAY * 60 * mul;
  const acc = (p.onGround ? 2400 : 1600) * mul;

  if (keys.left && !keys.right) { p.vx -= acc * dt; p.face = -1; }
  else if (keys.right && !keys.left) { p.vx += acc * dt; p.face = 1; }
  else {
    const f = (p.onGround ? 1800 : 500) * dt;
    p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
  }
  p.vx = clamp(p.vx, -maxV, maxV);

  // Coyote time và jump buffer giúp nhảy "dễ ăn" hơn
  p.coyote = p.onGround ? 0.1 : p.coyote - dt;
  p.buffer -= dt;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -DO_CAO_NHAY * 60;
    p.buffer = 0; p.coyote = 0; p.onGround = false;
    p.sx = 0.7; p.sy = 1.35;
    sfx("jump");
  }

  // Nhả nút sớm thì rơi nhanh hơn, nên nhảy thấp hơn
  const g = p.vy < 0 && !keys.jump ? GRAVITY * 1.8 : GRAVITY;
  p.vy = Math.min(p.vy + g * dt, 1100);

  if (p.vx && moveX(p, p.vx * dt)) p.vx = 0;

  const wasGround = p.onGround, fallV = p.vy;
  p.onGround = false;
  if (moveY(p, p.vy * dt)) {
    if (p.vy > 0) {
      p.onGround = true;
      if (!wasGround && fallV > 400) {
        p.sx = 1.3; p.sy = 0.75;
        crumbs(p.x + p.w / 2, p.y + p.h);
        sfx("land");
      }
    } else {
      // Cụng đầu: tìm ô phía trên đầu
      const ty = Math.floor((p.y - 1) / T);
      const mid = Math.floor((p.x + p.w / 2) / T);
      const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 0.01) / T);
      const tx = solid(mid, ty) ? mid : solid(l, ty) ? l : r;
      bump(tx, ty);
    }
    p.vy = 0;
  }

  p.coffee = Math.max(0, p.coffee - dt);
  p.inv = Math.max(0, p.inv - dt);
  p.sx += (1 - p.sx) * Math.min(1, dt * 10);
  p.sy += (1 - p.sy) * Math.min(1, dt * 10);

  if (p.y > ROWS * T + 100) die();
  else if (p.x + p.w >= flag.x) win();
}

function updateItems() {
  const p = player, cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  items = items.filter((it) => {
    if (Math.abs(it.x - cx) > it.r + p.w / 2 || Math.abs(it.y - cy) > it.r + p.h / 2) return true;
    if (it.type === "coin") {
      coins++; score += 10;
      floatText("+1", it.x, it.y - 10, "#ffd740");
      sfx("coin");
    } else if (it.type === "flower") {
      if (p.small) {
        if (!setSize(false)) return true;   // bị kẹt trần thì chưa hái được
        floatText("LỚN LÊN! 🌼", it.x, it.y - 20, "#ffee58", 28);
        sfx("grow");
      } else {
        score += 100;
        floatText("+100", it.x, it.y - 10, "#ffee58");
        sfx("coin");
      }
    } else {
      p.coffee = THOI_GIAN_CA_PHE; score += 200;
      floatText("CAFFEINE!!! ⚡", it.x, it.y - 20, "#ff7043", 30);
      shake = 8;
      sfx("power");
    }
    return false;
  });
}

function updateEnemies(dt) {
  const p = player;
  for (const e of enemies) {
    if (e.stomped) { e.squash -= dt; if (e.squash <= 0) e.dead = true; continue; }
    if (!e.active) { if (e.x < camX + VW + 80) e.active = true; else continue; }

    e.vy = Math.min(e.vy + GRAVITY * dt, 1100);
    if (moveX(e, e.vx * dt)) e.vx = -e.vx;
    e.onGround = false;
    if (moveY(e, e.vy * dt)) { if (e.vy > 0) e.onGround = true; e.vy = 0; }
    // Quay đầu ở mép vực
    if (e.onGround) {
      const ax = e.vx < 0 ? e.x - 1 : e.x + e.w + 1;
      if (!solid(Math.floor(ax / T), Math.floor((e.y + e.h + 1) / T))) e.vx = -e.vx;
    }
    if (e.y > ROWS * T + 100) e.dead = true;

    if (state === "play" && overlapRect(p, e)) {
      if (p.vy > 0 && p.y + p.h - e.y < 18) {
        e.stomped = true; e.squash = 0.6;
        p.vy = -DO_CAO_NHAY * 60 * (keys.jump ? 0.9 : 0.6);
        p.onGround = false; p.sx = 1.25; p.sy = 0.8;
        score += 100;
        floatText(pick(CAU_KHI_DAP_QUAI), e.x + e.w / 2, e.y - 10, "#fff", 26);
        crumbs(e.x + e.w / 2, e.y + e.h, 8, "#8d6e63");
        shake = Math.max(shake, 5);
        sfx("stomp");
      } else {
        hurt();
      }
    }
  }
  enemies = enemies.filter((e) => !e.dead);
}

// ---------- Vòng cập nhật chính ----------
function update(dt) {
  clock += dt;
  stateTime += dt;
  const p = player;

  if (state === "play") {
    updatePlayer(dt);
    if (state === "play") updateItems();
  } else if (state === "dying") {
    p.vy += GRAVITY * dt;
    p.y += p.vy * dt;
    p.rot += dt * 12;
    if (stateTime > 1.3) state = "deadmsg";
  }
  if (state === "play" || state === "dying") updateEnemies(dt);

  for (const q of parts) {
    q.vy += GRAVITY * 0.6 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.life -= dt;
  }
  parts = parts.filter((q) => q.life > 0);
  for (const t of texts) { t.y -= 60 * dt; t.life -= dt; }
  texts = texts.filter((t) => t.life > 0);
  for (const k in bumps) { bumps[k] -= dt; if (bumps[k] <= 0) delete bumps[k]; }
  shake = Math.max(0, shake - dt * 30);

  if (state === "play" || state === "start") {
    const target = p.x + p.w / 2 - VW * 0.4;
    camX += (clamp(target, 0, Math.max(0, COLS * T - VW)) - camX) * Math.min(1, dt * 8);
  }
}

// ---------- Vẽ ----------
const CLOUDS = Array.from({ length: 14 }, (_, i) => ({ x: i * 300 + ((i * 137) % 120), y: 40 + ((i * 53) % 110), s: 0.8 + ((i * 29) % 5) / 10 }));

function drawCloud(c) {
  const x = c.x - camX * 0.3, y = c.y, s = c.s;
  if (x < -150 || x > VW + 150) return;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.ellipse(x, y, 50 * s, 24 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x - 34 * s, y + 6 * s, 30 * s, 18 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 34 * s, y + 6 * s, 30 * s, 18 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.arc(x - 12 * s, y - 2 * s, 3 * s, 0, Math.PI * 2);
  ctx.arc(x + 12 * s, y - 2 * s, 3 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y + 4 * s, 8 * s, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
}

function drawTile(c, tx, ty) {
  const off = bumps[tx + "," + ty];
  const x = tx * T, y = ty * T - (off ? Math.sin((off / 0.15) * Math.PI) * 8 : 0);
  if (c === "#") {
    ctx.fillStyle = "#a0522d"; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#8b4513";
    ctx.fillRect(x + 6, y + 16, 6, 6); ctx.fillRect(x + 24, y + 28, 6, 6);
    if (!solid(tx, ty - 1)) {
      ctx.fillStyle = "#43a047"; ctx.fillRect(x, y, T, 9);
      ctx.fillStyle = "#66bb6a"; ctx.fillRect(x, y, T, 4);
    }
  } else if (c === "B") {
    ctx.fillStyle = "#c4622d"; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#7a3a17";
    ctx.fillRect(x, y + 19, T, 2); ctx.fillRect(x, y, T, 1);
    ctx.fillRect(x + 19, y, 2, 19); ctx.fillRect(x + 9, y + 21, 2, 19); ctx.fillRect(x + 29, y + 21, 2, 19);
  } else if (c === "?" || c === "K") {
    ctx.fillStyle = "#8a5a00"; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#f4b400"; ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
    ctx.fillStyle = "#8a5a00";
    ctx.font = `bold 26px ${UI_FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("?", x + T / 2 + 1, y + T / 2 + 2 + Math.sin(clock * 4) * 1.5);
    ctx.fillStyle = "#fff8e1";
    ctx.fillText("?", x + T / 2 - 1, y + T / 2 + Math.sin(clock * 4) * 1.5);
  } else if (c === "U") {
    ctx.fillStyle = "#5d4037"; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#8d6e63"; ctx.fillRect(x + 3, y + 3, T - 6, T - 6);
  }
}

function drawFlag() {
  const top = flag.y - 5 * T;
  ctx.fillStyle = "#9e9e9e"; ctx.fillRect(flag.x - 3, top, 6, 5 * T);
  ctx.fillStyle = "#ffd740";
  ctx.beginPath(); ctx.arc(flag.x, top, 7, 0, Math.PI * 2); ctx.fill();
  const wave = Math.sin(clock * 5) * 5;
  ctx.fillStyle = "#e53935";
  ctx.beginPath();
  ctx.moveTo(flag.x + 3, top + 8);
  ctx.lineTo(flag.x + 58, top + 24 + wave);
  ctx.lineTo(flag.x + 3, top + 42);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = `bold 12px ${UI_FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("ĐÍCH", flag.x + 8, top + 25 + wave / 2);
}

function drawItem(it) {
  const bob = Math.sin(clock * 3 + it.x) * 3;
  if (it.type === "coin") drawCoin(it.x, it.y + bob, it.r);
  else if (it.type === "flower") {
    ctx.font = `32px ${EMOJI}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🌼", it.x, it.y + bob);
  } else {
    ctx.font = `30px ${EMOJI}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🧋", it.x, it.y + bob);
  }
}

function drawCoin(x, y, r) {
  const rx = Math.max(2, r * Math.abs(Math.cos(clock * 4 + x * 0.05)));
  ctx.fillStyle = "#b8860b";
  ctx.beginPath(); ctx.ellipse(x, y, rx, r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd740";
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, rx - 3), r - 3, 0, 0, Math.PI * 2); ctx.fill();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w / 2, e.y + e.h);
  if (e.stomped) ctx.scale(1.35, 0.35);
  ctx.scale(e.vx > 0 ? -1 : 1, 1);          // emoji chuột quay mặt sang trái
  ctx.font = `34px ${EMOJI}`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText("🐀", 0, 5);
  // Kính râm
  ctx.fillStyle = "#000";
  ctx.fillRect(-19, -19, 8, 5);
  ctx.fillRect(-9, -19, 8, 5);
  ctx.fillRect(-12, -18, 4, 2);
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  ctx.save();
  let jx = 0, jy = 0;
  if (p.coffee > 0) { jx = (Math.random() - 0.5) * 5; jy = (Math.random() - 0.5) * 5; }
  ctx.translate(p.x + p.w / 2 + jx, p.y + p.h + jy);
  if (state === "dying") { ctx.translate(0, -p.h / 2); ctx.rotate(p.rot); ctx.translate(0, p.h / 2); }
  ctx.scale(p.sx, p.sy);
  const k = p.small ? 0.7 : 1;        // nhỏ lại thì vẽ bé đi
  ctx.scale(k, k);
  if (p.inv > 0 && Math.floor(clock * 14) % 2 === 0) ctx.globalAlpha = 0.35;   // nhấp nháy khi vừa bị cắn

  ctx.save();
  ctx.scale(p.face, 1);
  ctx.font = `46px ${EMOJI}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("🥖", 0, -18);
  ctx.restore();

  // Mắt lồi nhìn theo hướng chạy
  const lx = clamp(p.vx / 100, -2.5, 2.5), ly = clamp(p.vy / 300, -2.5, 2.5);
  for (const ex of [-7, 7]) {
    const x = ex + p.face * 2, y = -22;
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#333"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(x + lx, y + ly, 2.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawTextShadow(text, x, y, size, color = "#fff", align = "center") {
  ctx.font = `bold ${size}px ${UI_FONT}`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = "rgba(0,0,0,0.75)"; ctx.lineJoin = "round";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function fitSize(text, size, maxW) {
  ctx.font = `bold ${size}px ${UI_FONT}`;
  while (size > 14 && ctx.measureText(text).width > maxW) { size -= 2; ctx.font = `bold ${size}px ${UI_FONT}`; }
  return size;
}

function overlay(title, lines, titleColor = "#ffd740") {
  ctx.fillStyle = "rgba(10,10,30,0.72)";
  ctx.fillRect(0, 0, VW, VH);
  const total = 70 + lines.length * 40;
  let y = VH / 2 - total / 2 + 20;
  drawTextShadow(title, VW / 2, y, fitSize(title, 44, VW - 80), titleColor);
  y += 70;
  for (const l of lines) {
    const blink = l.startsWith("Nhấn");
    if (!blink || Math.floor(clock * 2) % 2 === 0) drawTextShadow(l, VW / 2, y, fitSize(l, 22, VW - 80), blink ? "#69f0ae" : "#fff");
    y += 40;
  }
}

function drawHUD() {
  drawTextShadow(`XU: ${coins}`, 20, 26, 22, "#ffd740", "left");
  drawTextShadow(`MẠNG: ${"♥".repeat(Math.max(0, lives))}`, 170, 26, 22, "#ff5252", "left");
  drawTextShadow(`ĐIỂM: ${score}`, VW - 20, 26, 22, "#fff", "right");
  if (player.coffee > 0) {
    const w = 200 * (player.coffee / THOI_GIAN_CA_PHE);
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(VW / 2 - 102, 48, 204, 14);
    ctx.fillStyle = "#ff7043"; ctx.fillRect(VW / 2 - 100, 50, w, 10);
    drawTextShadow("☕ CAFFEINE", VW / 2, 30, 18, "#ffccbc");
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, "#64b5f6"); sky.addColorStop(1, "#e3f2fd");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VW, VH);
  for (const c of CLOUDS) drawCloud(c);

  ctx.save();
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.translate(-Math.round(camX) + sx, sy);

  const c0 = Math.max(0, Math.floor(camX / T) - 1), c1 = Math.min(COLS - 1, Math.ceil((camX + VW) / T) + 1);
  for (let ty = 0; ty < ROWS; ty++)
    for (let tx = c0; tx <= c1; tx++)
      if (grid[ty][tx] !== " ") drawTile(grid[ty][tx], tx, ty);

  drawFlag();
  for (const it of items) drawItem(it);
  for (const e of enemies) drawEnemy(e);
  if (state !== "deadmsg") drawPlayer();

  for (const q of parts) {
    if (q.coin) drawCoin(q.x, q.y, 12);
    else { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size); ctx.globalAlpha = 1; }
  }
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, t.life / t.max);
    drawTextShadow(t.text, t.x, t.y, t.size, t.color);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  drawHUD();

  if (state === "start") {
    overlay(TEN_NHAN_VAT, [
      "Giải cứu tiệm bánh khỏi băng chuột cống đeo kính râm!",
      "← → hoặc A D: chạy   •   Space, ↑ hoặc W: nhảy",
      "Đạp lên đầu chuột để hạ nó. Uống cà phê sữa đá để chạy như bay!",
      "Nhấn Space để bắt đầu",
    ]);
  } else if (state === "deadmsg") {
    if (lives > 0) overlay(joke, [`Còn ${lives} mạng`, "Nhấn R để chơi lại"], "#ff8a65");
    else overlay("HẾT MẠNG 💀", [joke, `Điểm: ${score}`, "Nhấn R để chơi lại từ đầu"], "#ff5252");
  } else if (state === "win" && stateTime > 0.6) {
    overlay("THẮNG RỒI! 🎉", [joke, `Điểm: ${score}   •   Xu: ${coins}`, "Nhấn R để chơi lại"]);
  }
}

// ---------- Bàn phím ----------
const keys = { left: false, right: false, jump: false };
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "jump", ArrowUp: "jump", KeyW: "jump" };

addEventListener("keydown", (e) => {
  // Đang gõ tên hoặc bấm nút trong bảng xếp hạng thì không coi là phím điều khiển game
  if (e.target && /^(INPUT|BUTTON|TEXTAREA)$/.test(e.target.tagName)) return;
  initAudio();
  if (actx && actx.state === "suspended") actx.resume();
  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();             // không cho Space và mũi tên cuộn trang
    if (k === "jump" && !e.repeat) {
      if (state === "start") state = "play";
      else player.buffer = 0.12;
    }
    keys[k] = true;
  }
  if (e.code === "KeyR" && !e.repeat && !e.metaKey && !e.ctrlKey) restart();
});
addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener("blur", () => { keys.left = keys.right = keys.jump = false; });

// ---------- Bảng xếp hạng (Cloudflare Worker + D1) ----------
// Nếu không có server (ví dụ mở file trực tiếp) thì bảng không hiện và game vẫn chơi bình thường.
const lb = {
  el: document.getElementById("lb"),
  title: document.getElementById("lb-title"),
  sub: document.getElementById("lb-sub"),
  list: document.getElementById("lb-list"),
  empty: document.getElementById("lb-empty"),
  form: document.getElementById("lb-form"),
  name: document.getElementById("lb-name"),
  send: document.getElementById("lb-send"),
  msg: document.getElementById("lb-msg"),
  offered: false,     // đã mời gửi điểm cho lần kết thúc ván này chưa
  sent: false,        // đã gửi điểm của ván này chưa
  mine: null,         // { name, score } vừa gửi, để tô đậm trong bảng
};
const LB_ERRORS = {
  invalid_name: "Tên không hợp lệ (1 đến 12 ký tự, không xuống dòng).",
  invalid_score: "Điểm không hợp lệ.",
  body_too_large: "Dữ liệu quá lớn.",
};

function lbRender(scores) {
  lb.list.replaceChildren();
  lb.empty.hidden = scores.length > 0;
  for (const s of scores) {
    const li = document.createElement("li");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = s.name;                       // textContent: tên không bao giờ bị hiểu là HTML
    const pts = document.createElement("span");
    pts.textContent = String(s.score);
    li.append(who, pts);
    if (lb.mine && lb.mine.name === s.name && lb.mine.score === s.score) { li.className = "mine"; lb.mine = null; }
    lb.list.append(li);
  }
}

async function lbOpen(titleText) {
  let scores;
  try {
    const res = await fetch("/api/scores", { cache: "no-store" });
    if (!res.ok) return;
    scores = (await res.json()).scores;
  } catch (e) { return; }
  if (state !== "win" && state !== "deadmsg") return;      // người chơi đã bấm R trong lúc chờ
  lb.title.textContent = titleText;
  lb.sub.textContent = `Điểm của bạn: ${score}`;
  lb.msg.textContent = "";
  lb.sent = false;
  lb.mine = null;
  lb.send.disabled = false;
  lb.form.hidden = false;
  try { lb.name.value = localStorage.getItem("banhmi-name") || lb.name.value; } catch (e) { /* bỏ qua */ }
  lbRender(scores);
  lb.el.hidden = false;
  lb.name.focus();
}

function lbClose() { lb.el.hidden = true; }

lb.form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (lb.sent) return;
  const name = lb.name.value.trim();
  lb.send.disabled = true;
  lb.msg.textContent = "Đang gửi...";
  try {
    const res = await fetch("/api/scores", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, score }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      lb.msg.textContent = LB_ERRORS[data.error] || "Không gửi được, thử lại sau nhé.";
      lb.send.disabled = false;
      return;
    }
    lb.sent = true;
    lb.mine = { name, score };
    try { localStorage.setItem("banhmi-name", name); } catch (err) { /* bỏ qua */ }
    lbRender(data.scores);
    lb.form.hidden = true;
    lb.msg.textContent = "Đã gửi điểm!";
  } catch (err) {
    lb.msg.textContent = "Mất kết nối, thử lại sau nhé.";
    lb.send.disabled = false;
  }
});
document.getElementById("lb-restart").addEventListener("click", () => { restart(); lbClose(); });
document.getElementById("lb-close").addEventListener("click", lbClose);

// Gọi mỗi khung hình: mời gửi điểm khi thắng hoặc hết mạng, đóng bảng khi chơi lại
function lbTick() {
  const ended = state === "win" || (state === "deadmsg" && lives <= 0);
  if (ended && !lb.offered) {
    lb.offered = true;
    lbOpen(state === "win" ? "THẮNG RỒI! 🎉" : "HẾT MẠNG 💀");
  } else if (state === "play" || state === "start") {
    lb.offered = false;
    if (!lb.el.hidden) lbClose();
  }
}

// ---------- Chạy game ----------
newGame();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.05, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  lbTick();
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
